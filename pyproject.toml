[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "harta-criminali-pipeline"
version = "0.1.0"
description = "Pipeline de date pentru harta criminalilor în serie (Wikidata, Wikipedia, Murderpedia)"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "mwparserfromhell>=0.6.6",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "rapidfuzz>=3.9",
  "Unidecode>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
